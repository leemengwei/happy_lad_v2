{% extends 'layout.html' %}
{% block content %}
<h1>快乐家园</h1>
<section class="card album-entry">
  <header class="album-entry-header">
    <div>
      <h2>小帽子相册</h2>
      <div class="muted">把手机里的照片和视频放进宝宝相册</div>
    </div>
    <div class="home-qr">
      <img
        src="{{ url_for('dashboard.home_qr_png') }}"
        alt="主页二维码"
        loading="lazy"
      />
      <div class="muted">主页二维码</div>
    </div>
  </header>
  <div class="album-loading" data-role="home-media-loading">相册加载中...</div>
  <div class="album-thumbs" data-role="home-media-grid" style="display: none;"></div>
  <div class="muted" data-role="home-media-empty" style="display: none;">暂时还没有相册内容</div>
  <div class="muted" data-role="home-media-error" style="display: none;">相册加载失败，请稍后重试</div>
  <div class="muted" style="margin-top: 10px;">相册运行在独立存储服务器上，点击后直接访问。</div>
  <div
    data-role="home-media-config"
    data-fallback-image="{{ url_for('static', filename='img/sleepy-pig.svg') }}"
    style="display: none;"
  ></div>
  <div class="actions">
    <a class="btn" href="http://192.168.0.110:5001/">去小帽子相册</a>
  </div>
</section>
<div
  data-role="home-camera-config"
  data-stream-prefix="{{ url_for('dashboard.camera_stream', camera_id='__camera_id__') }}"
  data-detail-prefix="{{ url_for('dashboard.camera_detail', camera_id='__camera_id__') }}"
  data-snooze-image="{{ url_for('static', filename='img/sleepy-pig.svg') }}"
  style="display: none;"
></div>
<div class="card section-loading" data-role="home-camera-loading">摄像头状态加载中...</div>
<div class="muted" data-role="home-camera-error" style="display: none;">摄像头信息加载失败，请稍后重试</div>
<div class="muted" data-role="home-camera-empty" style="display: none;">暂无可用摄像头</div>
<div class="grid" data-role="home-camera-grid" style="display: none;"></div>
{% endblock %}
