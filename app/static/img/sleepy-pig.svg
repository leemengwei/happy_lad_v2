<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">睡觉的肥猪</title>
  <desc id="desc">一只粉色肥猪在云朵上睡觉，旁边有Z字。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4ff"/>
      <stop offset="100%" stop-color="#f7f2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g opacity="0.75" fill="#ffffff">
    <ellipse cx="150" cy="110" rx="70" ry="35"/>
    <ellipse cx="210" cy="110" rx="55" ry="28"/>
    <ellipse cx="180" cy="90" rx="55" ry="26"/>

    <ellipse cx="620" cy="80" rx="62" ry="30"/>
    <ellipse cx="675" cy="78" rx="42" ry="21"/>
    <ellipse cx="648" cy="62" rx="44" ry="20"/>
  </g>

  <ellipse cx="390" cy="375" rx="250" ry="74" fill="#ffffff" opacity="0.85" filter="url(#shadow)"/>

  <g filter="url(#shadow)">
    <ellipse cx="400" cy="270" rx="190" ry="112" fill="#f9a9c1"/>
    <ellipse cx="574" cy="250" rx="70" ry="62" fill="#f9a9c1"/>
    <ellipse cx="605" cy="226" rx="20" ry="30" fill="#f9a9c1" transform="rotate(28 605 226)"/>
    <ellipse cx="548" cy="202" rx="18" ry="26" fill="#f7a0bb" transform="rotate(-25 548 202)"/>

    <ellipse cx="600" cy="252" rx="35" ry="25" fill="#f3c0ce"/>
    <ellipse cx="586" cy="252" rx="5" ry="8" fill="#c97692"/>
    <ellipse cx="614" cy="252" rx="5" ry="8" fill="#c97692"/>

    <path d="M340 252 Q355 240 370 252" stroke="#7b3651" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M420 252 Q435 240 450 252" stroke="#7b3651" stroke-width="5" fill="none" stroke-linecap="round"/>

    <ellipse cx="262" cy="304" rx="48" ry="34" fill="#f7a0bb"/>
    <ellipse cx="308" cy="338" rx="52" ry="36" fill="#f7a0bb"/>
    <ellipse cx="470" cy="345" rx="54" ry="38" fill="#f7a0bb"/>
    <ellipse cx="520" cy="310" rx="50" ry="36" fill="#f7a0bb"/>

    <path d="M212 240 C175 234, 165 188, 204 176 C240 167, 255 204, 227 222" fill="none" stroke="#f08aa9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g fill="#6f95d8" font-family="'Arial', sans-serif" font-weight="700">
    <text x="662" y="180" font-size="56">Z</text>
    <text x="700" y="150" font-size="44">z</text>
    <text x="730" y="120" font-size="34">z</text>
  </g>

  <text x="400" y="455" text-anchor="middle" font-size="34" fill="#4a5f93" font-family="'Arial', sans-serif">瞌睡中，先让小猪睡一会儿</text>
</svg>
